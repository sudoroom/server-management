- name: Upgrade all installed packages
  ansible.builtin.dnf:
    name: "*"
    state: latest
  register: _uai_out
- name: UAIP Results
  when: _uai_out.changed
  ansible.builtin.debug: var=_uai_out.results

# Enable persistent journal with reasonable lifetimes
- name: Create persistent journal dir
  ansible.builtin.file:
    path: /var/log/journal
    owner: root
    group: systemd-journal
    state: directory
    mode: '0755'
  notify:
  - Restart journald
  - Flush journald

- name: Journald config
  ansible.builtin.template:
    src: journald.conf.j2
    dest: /etc/systemd/journald.conf
    owner: root
    group: root
    mode: '0644'
  notify:
  - Restart journald
  - Flush journald

