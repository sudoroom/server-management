- name: Install basic utilities
  ansible.builtin.dnf:
    name:
    - vim
    - ldns-utils
    - ldns
    - htop
    - policycoreutils-python-utils
    - bash-completion
    state: present
    install_weak_deps: False
  register: _ibt_out
- name: IBT results
  when: _ibt_out.changed
  ansible.builtin.debug: var=_ibt_out.results

# NOTE: wanted to remove os-prober, but it's required by various grub packages =/
- name: Disable os-prober
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_DISABLE_OS_PROBER'
    line: GRUB_DISABLE_OS_PROBER=true
  notify: Update GRUB2

